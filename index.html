<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="importmap"> {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { ARButton } from 'three/addons/webxr/ARButton.js';
      import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
      
      // Scene
      const scene = new THREE.Scene();
      scene.background = null
      
      // Camera
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;
      
      // Renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);
      document.body.appendChild(
          ARButton.createButton(renderer, {
              requiredFeatures: ['local-floor'],
              optionalFeatures: [
                  'hit-test',
                  'plane-detection',
                  'anchors'
              ]
          })
      );
      
      // Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 5, 5);
      scene.add(light);

      // Controller
      const right_controller = renderer.xr.getController(1);
      scene.add(right_controller);
      
      // Gun
      const loader = new GLTFLoader();
      
      loader.load('gun.glb', (gltf) => {
          const gun = gltf.scene;
          gun.scale.setScalar(0.0025);
          gun.position.set(0, 0, -0.1);
          gun.rotation.set(-Math.PI / 2, 0, Math.PI / 2);
          right_controller.add(gun)
      });
      
      // Resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Controller position
      const right_controllerPosition = new THREE.Vector3();
      // Animation
      function animate() {
          right_controller.getWorldPosition(right_controllerPosition);
          renderer.render(scene, camera);
      }
      renderer.setAnimationLoop(animate);
    </script>
  </body>
</html>
