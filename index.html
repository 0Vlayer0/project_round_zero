<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Three.js</title>
    <style>
      body {
        margin: 0;
        overflow: hidden;
      }
    </style>
  </head>
  <body>
    <script type="importmap"> {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.186.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.186.0/examples/jsm/"
            }
        }
    </script>
    <script type="module">
      import * as THREE from 'three';
      import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
      import { ARButton } from 'three/addons/webxr/ARButton.js';
      import { XRControllerModelFactory } from 'three/addons/webxr/XRControllerModelFactory.js';
      
      // Scene
      const scene = new THREE.Scene();
      scene.background = null
      
      // Camera
      const camera = new THREE.PerspectiveCamera(75, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.z = 5;
      
      // Renderer
      const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.xr.enabled = true;
      document.body.appendChild(renderer.domElement);
      document.body.appendChild(
          ARButton.createButton(renderer, {
              requiredFeatures: ['local-floor'],
              optionalFeatures: [
                  'hit-test',
                  'plane-detection',
                  'anchors'
              ]
          })
      );
      
      // Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.5));
      const light = new THREE.DirectionalLight(0xffffff, 1);
      light.position.set(5, 5, 5);
      scene.add(light);

      // Controller
      const right_controller = renderer.xr.getController(1);
      const left_controller = renderer.xr.getController(0);
      scene.add(left_controller);
      scene.add(right_controller);

      // Hands
      const right_hand = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0x251A6B}))
      right_controller.add(right_hand)
      const left_hand = new THREE.Mesh(new THREE.SphereGeometry(0.05, 8, 8), new THREE.MeshBasicMaterial({ color: 0x9C510F}))
      left_controller.add(left_hand)
      
      // Gun
      const loader = new GLTFLoader();
      
      loader.load('gun.glb', (gltf) => {
          const gun = gltf.scene;
          gun.scale.setScalar(0.0025);
          gun.position.set(0, 0, -0.3);
          gun.rotation.set(-Math.PI / 2, 0, Math.PI / 2);
          scene.add(gun)
      });
      
      // Resize
      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });

      // Screen
      // Create a canvas element
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 128;
      const ctx = canvas.getContext('2d');
      
      // Draw text
      ctx.font = 'bold 64px Arial';
      ctx.fillStyle = 'white';
      ctx.textAlign = 'center';
      ctx.fillText('My Flat Text', canvas.width / 2, canvas.height / 2);
      
      // Convert to texture
      const texture = new THREE.CanvasTexture(canvas);
      const geometry = new THREE.PlaneGeometry(canvas.width, canvas.height);
      const material = new THREE.MeshStandardMaterial({ map: texture });
      const mesh = new THREE.Mesh(geometry, material);
      
      // Position in scene
      mesh.position.z = 10;
      right_hand.add(mesh);

      // Controller position
      const right_controller_position = new THREE.Vector3();
      const left_controller_position = new THREE.Vector3()
      // Animation
      function animate() {
          right_controller.getWorldPosition(right_controller_position);
          left_controller.getWorldPosition(left_controller_position);
          renderer.render(scene, camera);
      }
      renderer.setAnimationLoop(animate);
    </script>
  </body>
</html>
